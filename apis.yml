apis:
- aid: hubble-network:hubble-platform-api
  name: Hubble Platform API
  description: 'The Hubble Cloud API is the API-first control plane for the Hubble
    Network platform. It manages devices (register, list, get, update, batch update,
    batch delete), retrieves and streams decrypted Bluetooth packet data with continuation-token
    pagination, configures packet webhooks (create, list, update, delete, test), reports
    platform metrics for API, packet, webhook and device activity, administers organizations,
    users and invitations, provisions scoped API keys, and exposes billing usage, invoices,
    subscription and payment methods. Authentication is a JWT bearer API key carrying
    up to 16 granular authorization scopes; the API is versioned in the URL path (/v1,
    /v2) with legacy /api aliases supported for a minimum of one year.'
  humanURL: https://hubble.com/docs/api-specification/hubble-platform-api
