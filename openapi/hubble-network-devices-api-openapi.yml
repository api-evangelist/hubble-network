openapi: 3.2.0
info:
  title: Hubble Platform Devices API
  description: The Hubble platform is built API-first.
  version: 1.0.0
servers:
- url: https://api.hubble.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Devices
paths:
  /v2/org/{org_id}/devices:
    post:
      tags:
      - Devices
      operationId: register-new-devices
      x-criticality: high
      summary: Register New Devices
      description: 'Register one or more devices to your organization.


        **Required Scope:** `write-devices`


        ## Overview

        This endpoint supports bulk device registration with specified encryption mode, and custom naming and tagging.


        ## Device Encryption Modes


        ### Set Key Length

        Set encryption key length to match your device firmware''s encryption library requirement:

        * **256-bit key** (32 bytes): set `encryption` to "AES-256-CTR"

        * **128-bit key** (16 bytes): set `encryption` to "AES-128-CTR"

        * **128-bit key, IN100 protocol** (16 bytes): set `encryption` to "AES-128-EAX"


        ### Set Counter Source for EID Rotation

        The Hubble Device SDK rotates through ephemeral IDs (EID) so that devices are anonymous on the network.

        Specify the `counter_source` based on your hardware capabilities:

        * Use "UNIX_TIME" for **time-based encryption**, e.g. for devices with a real time clock (RTC). **This is the default value.**

        * Use "DEVICE_UPTIME" for **timeless encryption**, e.g. using the device uptime counter to rotate EIDs.


        ### Set EID Rotation Period (AES-128-EAX only)

        For the IN100 protocol (`encryption` of "AES-128-EAX"), you may optionally override the EID rotation period with `eid_rotation.period_exponent`: the base-2 exponent of the rotation period in seconds (matches the IN100 configuration field).

        Must be between 10 and 15 inclusive.

        The period defaults to `period_exponent: 15`, corresponding to 32,768 seconds (~9 hours).


        ## Device Metadata

        You can optionally provide `names` and `tags` for each device being provisioned:

        * `names`: An array of device names.

        * `tags`: An array of device tags.


        ## Device Key

        By default `device.key` is returned encoded in standard Base64 format, and is automatically compatible with the Hubble Device SDK.

        Pass `key_format=hex` to receive device.key as a lowercase hexadecimal string instead.'
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      - $ref: '#/components/parameters/deviceKeyFormatQueryParam'
      - $ref: '#/components/parameters/contentTypeJsonHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - encryption
              properties:
                n_devices:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 1
                  description: Number of devices to provision
                encryption:
                  $ref: '#/components/schemas/deviceEncryption'
                names:
                  type: array
                  items:
                    $ref: '#/components/schemas/deviceName'
                  description: "Optional array of device names. \nIf provided, the length must match the number of devices being provisioned.\n"
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/deviceTags'
                  description: "Optional array of tag maps for each device. \nIf provided, the length must match the number of devices being provisioned.\n"
                eid_rotation:
                  $ref: '#/components/schemas/eidRotation'
                  description: 'Ephemeral ID (EID) rotation configuration for provisioned devices.

                    `counter_source` default is "UNIX_TIME".

                    '
                install_locations:
                  type: array
                  items:
                    $ref: '#/components/schemas/installLocation'
                  description: 'Optional array of install locations for each provisioned device.

                    If provided, the length must match the number of devices being provisioned.

                    '
              example:
                n_devices: 1
                encryption: AES-256-CTR
                names:
                - my-device
            examples:
              encryptedProtocolUnixTime:
                summary: AES-CTR + UNIX_TIME eid_rotation
                description: 'Default-style encrypted device. Omit `eid_rotation` or set only `counter_source` to `UNIX_TIME`.

                  '
                value:
                  n_devices: 1
                  encryption: AES-256-CTR
                  names:
                  - sensor-001
              encryptedProtocolDeviceUptime:
                summary: AES-CTR + DEVICE_UPTIME eid_rotation
                description: 'Configure a device to leverage its uptime as the EID rotation counter source used for encryption.

                  '
                value:
                  n_devices: 1
                  encryption: AES-128-CTR
                  names:
                  - uptime-sensor
                  eid_rotation:
                    counter_source: DEVICE_UPTIME
              encryptedProtocolIN100:
                summary: AES-128-EAX (IN100 protocol) with DEVICE_UPTIME
                description: 'Provision a device using the IN100 protocol (AES-EAX authenticated encryption).

                  '
                value:
                  n_devices: 1
                  encryption: AES-128-EAX
                  names:
                  - in100-sensor
                  eid_rotation:
                    counter_source: DEVICE_UPTIME
                    period_exponent: 15
      responses:
        '200':
          description: Devices provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          $ref: '#/components/schemas/deviceId'
                        name:
                          $ref: '#/components/schemas/deviceName'
                        created_ts:
                          type: integer
                          format: int64
                          description: Unix timestamp (in seconds) when the device was created
                        tags:
                          $ref: '#/components/schemas/deviceTags'
                        protocol:
                          type: object
                          description: Protocol configuration for the device
                          properties:
                            terrestrial:
                              type: object
                              properties:
                                version:
                                  type: integer
                                  format: uint8
                                  description: Protocol version number
                        eid_rotation:
                          $ref: '#/components/schemas/eidRotation'
                          description: EID rotation configuration for the device
                        network_id:
                          type: integer
                          description: Network ID for the device, if applicable
                        key:
                          type: string
                          description: 'Encryption key for the device, when applicable.

                            Default Base64-encoded bytes (when key_format omitted or key_format=base64).

                            With key_format=hex: lowercase hexadecimal string.

                            '
                        install_location:
                          $ref: '#/components/schemas/installLocation'
              examples:
                encryptedProtocolUnixTime:
                  summary: Matches AES-CTR + UNIX_TIME eid_rotation
                  value:
                    devices:
                    - device_id: 6ea53e36-b7fb-429f-8c2e-d536cab71089
                      name: sensor-001
                      created_ts: 1734567890
                      tags:
                        _env: production
                      protocol:
                        terrestrial:
                          version: 0
                      eid_rotation:
                        counter_source: UNIX_TIME
                      key: YWJjZGVmZw==
                encryptedProtocolDeviceUptime:
                  summary: Matches AES-CTR + DEVICE_UPTIME eid_rotation
                  value:
                    devices:
                    - device_id: 7fb53e36-b7fb-429f-8c2e-d536cab71090
                      name: uptime-sensor
                      created_ts: 1734567891
                      tags:
                        _env: production
                      protocol:
                        terrestrial:
                          version: 0
                      eid_rotation:
                        counter_source: DEVICE_UPTIME
                      key: YWJjZGVmZw==
                encryptedProtocolIN100:
                  summary: Matches AES-128-EAX (IN100 protocol) with DEVICE_UPTIME
                  value:
                    devices:
                    - device_id: 8ab53e36-b7fb-429f-8c2e-d536cab71091
                      name: in100-sensor
                      created_ts: 1734567892
                      tags:
                        _env: production
                      protocol:
                        terrestrial:
                          version: 2
                      eid_rotation:
                        counter_source: DEVICE_UPTIME
                        period_exponent: 15
                      key: YWJjZGVmZw==
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'
  /v1/org/{org_id}/devices:
    get:
      tags:
      - Devices
      operationId: list-devices
      x-criticality: high
      summary: List Devices
      description: 'Returns all devices for your organization.


        **Required Scope:** `read-devices`


        ## Overview

        Use this endpoint to manage your device inventory and map Hubble-registered devices to your system.

        (To consume a stream of incoming data, use the **Retrieve Organization Packets** endpoint.)


        ## Query Parameters


        ### Timestamp Filters

        Use timestamp filters to trim down the search results.

        * For simpliticy, we support the `between:{after_timestamp}:{before_timestamp}` operator.

        * The `after_timestamp` value is inclusive and the `before_timestamp` value is exclusive.


        ### Recent Packet

        Each device may return a `most_recent_packet` object. This is a sample packet that is periodically refreshed.

        * **Latency:** provided data is not updated in real-time or atomically with packet data.

        * **Availability:** registered devices that have never sent a packet will have an empty `most_recent_packet` field.


        :::warning

        **This endpoint should not be used to request packet data.** See "Retrieve Organization Packets".

        :::


        When sorting by `most_recent_packet`,

        - Devices that have never sent a packet are included in results and sort to the beginning (ascending) or end (descending) of the page.

        - If `sort_ascending` is true, the pagination may return duplicate values since a device with a new `most_recent_packet` could be returned in subsequent pages.

        - If `sort_ascending` is false, the pagination may skip devices that receive new `most_recent_packet` data during the pagination.


        ## Example Queries

        - **Unused devices:** `filter_most_recent_packet_ts=between:0:1`

        - **Recently Active Devices:** `filter_most_recent_packet_ts=between:{timestamp_one_day_ago}:{timestamp_now}`

        - **Inactive Devices:** `filter_most_recent_packet_ts=between:1:{timestamp_one_week_ago}`

        - **Recently Registered Devices:** `filter_created_ts=between:{timestamp_one_day_ago}:{timestamp_now}`'
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      - $ref: '#/components/parameters/limitQueryParam'
      - $ref: '#/components/parameters/filterTagsQueryParam'
      - $ref: '#/components/parameters/filterCreatedTSQueryParam'
      - $ref: '#/components/parameters/filterMostRecentPacketTSQueryParam'
      - $ref: '#/components/parameters/sortFieldQueryParam'
      - $ref: '#/components/parameters/sortAscendingQueryParam'
      - $ref: '#/components/parameters/continuationTokenHeader'
      responses:
        '200':
          description: Device Pages
          headers:
            Continuation-Token:
              $ref: '#/components/headers/ContinuationTokenHeader'
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/organizationDevice'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'
    patch:
      tags:
      - Devices
      operationId: batch-update-devices
      x-criticality: high
      summary: Batch Update Devices
      description: 'Update multiple registered devices belonging to your organization in a single request.


        **Required Scope:** `write-devices`


        ## Overview

        - A maximum of 1000 devices can be updated in a single request.

        - Each update is idempotent. In the event of an internal error (i.e. `5xx`) some updates may be applied and others may not. Each update is idempotent and the whole request can be retried again to ensure a consistent update across the batch.'
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - updates
              properties:
                updates:
                  type: array
                  description: Array of device update operations, up to 1000.
                  items:
                    type: object
                    required:
                    - device_id
                    properties:
                      device_id:
                        $ref: '#/components/schemas/deviceId'
                      set_name:
                        $ref: '#/components/schemas/deviceName'
                        description: Set the device name
                      set_tags:
                        $ref: '#/components/schemas/deviceTags'
                        description: Set the device tags
                      set_install_location:
                        $ref: '#/components/schemas/installLocation'
                      set_destination_org_id:
                        type: string
                        format: uuid
                        description: 'Reassign this device to another organization. The destination

                          must be this organization''s paired sandbox/production partner

                          (created via the create-sandbox-org flow) - reassignment

                          between unpaired orgs is rejected.


                          Cannot be combined with `set_name`, `set_tags`,

                          `set_install_location`, or `set_deploy` on the same update

                          item. Other items in the same batch request may still be

                          ordinary field updates.


                          This moves the device''s encryption keys and network-ID

                          lookups to the destination org and updates its `_env` tag to

                          match (`sandbox` or `production`). Packet history and device

                          history are **not** moved - they remain associated with the

                          device in the source organization. If the destination is

                          the sandbox org, its device-count cap is enforced across all

                          reassignments targeting it within the same batch request.

                          '
                        example: 123e4567-e89b-12d3-a456-426614174000
            examples:
              updateNames:
                value:
                  updates:
                  - device_id: 6ea53e36-b7fb-429f-8c2e-d536cab71089
                    set_name: Device 1
                  - device_id: 7fb64f47-c8gc-530g-9d3f-e647dbc8219a
                    set_name: Device 2
              updateTags:
                value:
                  updates:
                  - device_id: 6ea53e36-b7fb-429f-8c2e-d536cab71089
                    set_tags:
                      location: warehouse-a
                  - device_id: 7fb64f47-c8gc-530g-9d3f-e647dbc8219a
                    set_tags:
                      location: warehouse-b
      responses:
        '200':
          description: Updated Devices
          content:
            application/json:
              schema:
                type: object
                required:
                - devices
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/organizationDevice'
              examples:
                success:
                  value:
                    devices:
                    - id: 6ea53e36-b7fb-429f-8c2e-d536cab71089
                      name: Device 1
                      created_ts: 1609459200
                      tags:
                        location: warehouse-a
                      most_recent_packet: {}
                    - id: 7fb64f47-c8gc-530g-9d3f-e647dbc8219a
                      name: Device 2
                      created_ts: 1609459200
                      tags:
                        location: warehouse-b
                      most_recent_packet: {}
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'
    delete:
      tags:
      - Devices
      operationId: batch-delete-devices
      x-criticality: high
      summary: Batch Delete Devices
      description: 'Delete multiple registered devices from your organization in a single request.


        **Required Scope:** `write-devices`


        ## Overview

        - A maximum of 1000 devices can be deleted in a single request.

        - Each delete is idempotent. In the event of an internal error (i.e. `5xx`) some deletions may be applied and others may not. The whole request can be retried again to ensure a consistent deletion across the batch.'
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_ids
              properties:
                device_ids:
                  type: array
                  description: Array of device IDs to delete, up to 1000.
                  items:
                    $ref: '#/components/schemas/deviceId'
            examples:
              deleteMultipleDevices:
                value:
                  device_ids:
                  - 6ea53e36-b7fb-429f-8c2e-d536cab71089
                  - 7fb64f47-c8gc-530g-9d3f-e647dbc8219a
                  - 8gc75g58-d9hd-641h-0e4g-f758ecd932b0
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'
  /v1/org/{org_id}/devices/{device_id}:
    get:
      tags:
      - Devices
      operationId: get-device
      x-criticality: high
      summary: Get Device
      description: 'Return a specific registered device belonging to your organization.


        **Required Scope:** `read-devices`'
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      - $ref: '#/components/parameters/deviceIdPathParam'
      responses:
        '200':
          description: Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizationDevice'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'
    patch:
      tags:
      - Devices
      operationId: update-device
      x-criticality: high
      summary: Update Device
      description: 'Update a registered device belonging to your organization.


        **Required Scope:** `write-devices`'
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      - $ref: '#/components/parameters/deviceIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                set_name:
                  $ref: '#/components/schemas/deviceName'
                set_tags:
                  $ref: '#/components/schemas/deviceTags'
                set_install_location:
                  $ref: '#/components/schemas/installLocation'
                set_destination_org_id:
                  type: string
                  format: uuid
                  description: 'Reassign this device to another organization. The destination

                    must be this organization''s paired sandbox/production partner

                    (created via the create-sandbox-org flow) - reassignment

                    between unpaired orgs is rejected.


                    Cannot be combined with `set_name`, `set_tags`,

                    `set_install_location`, or `set_deploy` in the same request.


                    This moves the device''s encryption keys and network-ID

                    lookups to the destination org and updates its `_env` tag to

                    match (`sandbox` or `production`). Packet history and device

                    history are **not** moved - they remain associated with the

                    device in the source organization. If the destination is

                    the sandbox org, its device-count cap is enforced.

                    '
                  example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Updated Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organizationDevice'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'
    delete:
      tags:
      - Devices
      operationId: delete-device
      x-criticality: high
      summary: Delete Device
      description: 'Delete a registered device from your organization.


        **Required Scope:** `write-devices`'
      parameters:
      - $ref: '#/components/parameters/orgIdPathParam'
      - $ref: '#/components/parameters/deviceIdPathParam'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'
components:
  schemas:
    deviceId:
      type: string
      format: uuid
      description: Primary UUID identifier for a registered device
    organizationDevice:
      type: object
      required:
      - name
      - id
      - created_ts
      - tags
      properties:
        name:
          $ref: '#/components/schemas/deviceName'
        id:
          $ref: '#/components/schemas/deviceId'
        created_ts:
          $ref: '#/components/schemas/utcTimestampInteger'
        tags:
          $ref: '#/components/schemas/deviceTags'
        encryption:
          $ref: '#/components/schemas/deviceEncryption'
        eid_rotation:
          $ref: '#/components/schemas/eidRotation'
        install_location:
          $ref: '#/components/schemas/installLocation'
        most_recent_packet:
          type: object
          description: 'Most recent packet metadata for different network types.

            The most recent packet value is only updated periodically.

            '
          properties:
            satellite:
              type:
              - object
              - 'null'
              properties:
                timestamp:
                  $ref: '#/components/schemas/utcTimestampNumber'
                  description: Unix timestamp of a recent satellite packet
                location:
                  $ref: '#/components/schemas/latLongLocation'
                  description: Location data from a recent satellite packet
            terrestrial:
              type:
              - object
              - 'null'
              properties:
                timestamp:
                  $ref: '#/components/schemas/utcTimestampNumber'
                  description: Unix timestamp of a recent terrestrial packet
                location:
                  $ref: '#/components/schemas/latLongLocation'
                  description: Location data from a recent terrestrial packet
    latLongLocation:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          description: Latitude in Decimal Degrees DDD.DDDDD°
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Longitude in Decimal Degrees DDD.DDDDD°
          format: double
          minimum: -180
          maximum: 180
    eidRotation:
      type: object
      description: 'Configuration for EID (Ephemeral ID) rotation on a device.

        EID rotation allows devices to use rotating ephemeral identifiers based on the specified counter source.

        When not specified, devices will use the UNIX_TIME counter source which relies on the device knowing an accurate epoch time.

        The DEVICE_UPTIME counter source enables EID rotation without requiring a real-time clock.

        '
      properties:
        counter_source:
          type: string
          enum:
          - UNIX_TIME
          - DEVICE_UPTIME
          description: 'The counter source used for EID rotation.

            * `UNIX_TIME` - Counter is based on the current Unix (epoch) time.

            * `DEVICE_UPTIME` - Counter is based on the device''s uptime.

            '
        period_exponent:
          type: integer
          minimum: 10
          maximum: 15
          default: 15
          description: 'Base-2 exponent of the EID rotation period in seconds, used only with `encryption` of "AES-128-EAX" (IN100 protocol).

            Matches the IN100 hardware''s configuration field. Must be between 10 (~17 minutes) and 15 (~9 hours) inclusive.

            '
    errorResponse:
      type: object
      properties:
        code:
          type: integer
          description: The HTTP status code
        description:
          type: string
          description: 'A description for the error.

            For user errors, we attempt to be as descriptive as possible to help with diagnosing the issue.

            For internal errors, the error description is only indicates that a retry should occur but we log the full error so that we can diagnose it.

            Error descriptions can change over time and should not be programmed against.

            '
        name:
          type: string
          enum:
          - Bad Request
          - Unauthorized
          - Not Found
          - Too Many Requests
          - Internal Server Error
          description: '`name` is a short name for the error.

            '
    utcTimestampInteger:
      type: integer
      format: int64
      description: An UTC second-precision timestamp formatted as an integer
    deviceTags:
      type: object
      additionalProperties:
        type: string
      description: "Tags are user-defined key/value pairs that can be attributed to a device. \nA device may have up to 10 tags.\n**Custom tags:** create your own tags with `key` length up to 32 characters and `value` length up to 128 characters.\n**Platform tags:** use Hubble-defined tags to organize devices.\n- `_env` tag: `production` indicates if a device belongs to the live environment, and `sandbox` for the test environment. A device will always have an `_env` tag assigned.\n"
      example:
        _env: production
    deviceEncryption:
      type: string
      enum:
      - AES-256-CTR
      - AES-128-CTR
      - AES-128-EAX
      - NONE
      description: Encryption mode configured for the device at registration.
    utcTimestampNumber:
      type: number
      format: double
      description: An UTC second-precision timestamp formatted as a floating point number
    orgId:
      type: string
      format: uuid
      description: The ID for an organization
    installLocation:
      type: object
      description: 'Fixed installation location of a device.

        To clear a previously set location, send lat/long of 0,0.

        '
      required:
      - lat
      - long
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude in Decimal Degrees DDD.DDDDD°
        long:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude in Decimal Degrees DDD.DDDDD°
        location_name:
          type: string
          maxLength: 500
          description: Human-readable label for the location.
    deviceName:
      type: string
      description: Assigned name for the device
      maxLength: 250
  parameters:
    deviceIdPathParam:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/deviceId'
    filterCreatedTSQueryParam:
      name: filter_created_ts
      in: query
      required: false
      schema:
        type: string
      description: "Filter devices by creation timestamp (e.g., filter_created_ts=between:1000:2000)\nTimestamps are in seconds since the Unix epoch.\nThe only supported filtering operator currently is `between`. \n"
    contentTypeJsonHeader:
      name: Content-Type
      in: header
      schema:
        type: string
      description: An indication that the payload is JSON
      example: application/json
    deviceKeyFormatQueryParam:
      name: key_format
      in: query
      required: false
      schema:
        type: string
        enum:
        - base64
        - hex
        default: base64
      description: 'Encoding for `device.key` in the response. `base64` (default) returns standard Base64;

        `hex` returns a lowercase hexadecimal string.

        '
    filterMostRecentPacketTSQueryParam:
      name: filter_most_recent_packet_ts
      in: query
      required: false
      schema:
        type: string
      description: "Filter devices by most recent packet timestamp (e.g., filter_most_recent_packet_ts=between:1000:2000)\nTimestamps are in seconds since the Unix epoch.\nThe most recent packet value is only updated periodically.\nThe only supported filtering operator currently is `between`. \n"
    limitQueryParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        maximum: 1000
        minimum: 10
        default: 250
      description: A limit for the page size of devices
    continuationTokenHeader:
      name: Continuation-Token
      in: header
      required: false
      schema:
        type: string
      description: A token to indicate how to continue paging
    sortFieldQueryParam:
      name: sort_field
      in: query
      required: false
      schema:
        type: string
        enum:
        - created_ts
        - most_recent_packet_ts
      description: Field to sort devices by
    filterTagsQueryParam:
      name: filter_tags
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          description: 'A tag to match against. For example: _env:production.

            '
      description: 'A set of device **platform tags** specifying which packets to include.

        Only platform tags are queryable: `_env:production`, `_env:sandbox`.

        The query param can be used multiple times to form a list of tags.

        Packet matching criteria uses AND logic when different tag keys are used in a list of tags, and OR logic when the same tag key is used more than once.

        '
    orgIdPathParam:
      name: org_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/orgId'
      description: Your organization ID
    sortAscendingQueryParam:
      name: sort_ascending
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: Sort order (true for ascending, false for descending)
