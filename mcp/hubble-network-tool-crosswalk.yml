findings_for_provider:
- id: skill-grounded-on-legacy-alias
  severity: medium
  detail: >-
    The first-party Agent Skill references /api/... on all 66 endpoint mentions and /v1/... zero times.
    Re-ground it on the canonical versioned paths so agents are not wired to the alias window.
- id: invitation-delete-shape-conflict
  severity: medium
  detail: >-
    OpenAPI says DELETE /v1/org/{org_id}/invitations (body); the Agent Skill says
    DELETE /api/org/{org_id}/invitations/{invitation_id} (path). The two contracts disagree.
- id: skill-missing-webhook-test
  severity: low
  detail: >-
    test-webhook-endpoint is the pre-flight verification step for a webhook receiver and is absent from
    the skill, so an agent onboarding a webhook has no documented way to verify it before going live.
- id: no-mcp-server
  severity: low
  detail: >-
    Hubble ships a Claude Code Agent Skill but no MCP server. The 39 operations are uniformly shaped
    (JWT bearer, org-scoped paths) and would map cleanly to MCP tools; mcp/hubble-network-mcp.yml
    already carries the derived candidate list.
