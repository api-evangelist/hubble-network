transport: HTTPS POST push to a customer-registered endpoint
delivery:
  guarantee: at-least-once
  ordering: not guaranteed
  ack: 2xx within 10 seconds
  retries: exponential backoff for up to 3 hours
  duplicates: possible — consumers must be idempotent
  filtering: none — all packets for all devices in the organization are delivered
authentication:
  header: HTTP-X-HUBBLE-TOKEN
  type: shared secret
  issued: A confidential unique string generated per webhook endpoint at creation (components.schemas.webhookSecret).
  signature: null
  note: A static shared secret in a header — there is no HMAC body signature and no timestamp/replay window,
    so a receiver cannot verify payload integrity, only sender knowledge of the token. Rotation requires
    update-webhook-endpoint.
batching:
  field: max_batch_size
  default: 100
  min: 10
  max: 1000
  cadence: every several seconds, or as soon as max_batch_size is reached
  actual_size: between 1 and max_batch_size
limits:
  endpoints_per_organization: 2
  note: Two simultaneous endpoints are allowed specifically to support migration between receivers.
events:
- name: packet.batch
  channel: customer webhook URL
  operation: receive
  criticality: high
  description: A batch of decrypted Bluetooth packets received for the organization across all registered
    devices.
  payload_schema: components.schemas.packetBatch
  media_type: application/json
  modeled_by: openapi/hubble-network-platform-openapi.yml#packet-webhook-example
  fields:
  - field: packets[].device.id
    description: Device UUID.
  - field: packets[].device.payload
    description: Decrypted payload, Base64 encoded.
  - field: packets[].device.rssi
    description: Received signal strength.
  - field: packets[].device.timestamp
    description: Unix timestamp of the packet.
  - field: packets[].device.sequence_number
    description: Device sequence number — use with id + timestamp to de-duplicate.
  - field: packets[].device.counter
    description: Time-based counter associated with the packet.
  - field: packets[].device.name
    description: Device name.
  - field: packets[].device.tags
    description: Custom and platform tags on the device.
  - field: packets[].location
    description: Latitude, longitude, altitude, accuracy and timestamp of the detection.
  - field: packets[].network_type
    description: TERRESTRIAL or SATELLITE.
  - field: packets[].gateway
    description: Gateway id and BLE service id of the receiving gateway; only present on self-provided
      packets.
