purpose: >-
  Bind each agent-facing tool to its backing REST operationId so the tool inherits a REAL inputSchema
  (that operation's parameters + requestBody) instead of a guessed one. For Hubble the interesting
  divergence is NOT MCP-vs-REST — Hubble publishes no MCP server and no GraphQL — it is
  SKILL-vs-REST: the provider's own Agent Skill covers 34 of 39 operations and instructs agents to
  call them at the LEGACY /api/... alias paths rather than the canonical /v1//v2 paths in the spec.

surfaces:
  rest_openapi: openapi/hubble-network-platform-openapi.yml   # 39 operations, 48 schemas, OpenAPI 3.0.3
  graphql: null                                               # none published; no .graphql in any of the 23 public repos
  mcp:
    url: null                                                 # Hubble publishes NO hosted or remote MCP server
    status: candidate
    note: tools in mcp/hubble-network-mcp.yml are DERIVED 1:1 from OpenAPI operations, not published by Hubble.
  agent_skill:
    url: https://github.com/HubbleNetwork/agent-plugins
    file: skills/hubble-network-cloud-api-SKILL.md
    reference: https://raw.githubusercontent.com/HubbleNetwork/agent-plugins/main/hubble-cloud-api-skill/skills/hubble-cloud-api/references/api-reference.md
    status: published
    official: true
    note: This is Hubble's real, first-party agent surface. It drives the REST API directly over HTTP/curl.

# PATH-FORM DIVERGENCE — the single most consequential finding in this crosswalk.
# Hubble's published Agent Skill uses the legacy /api/... alias on EVERY endpoint (66 occurrences)
# and the canonical /v1/... form ZERO times. The aliases are supported for a minimum of one year
# (lifecycle/hubble-network-lifecycle.yml), so agents following the provider's own skill are wired
# to the deprecation-eligible surface rather than the versioned one.
path_form_divergence:
  skill_path_form: /api/org/{org_id}/...        # and /api/v2/org/{org_id}/devices
  openapi_path_form: /v1/org/{org_id}/...       # and /v2/org/{org_id}/devices
  skill_uses_api_alias: 66
  skill_uses_v1_canonical: 0
  alias_support_window: minimum 1 year from the introduction of the versioned path
  impact: >-
    Every operationId below is reachable at both forms today. An agent grounded only in the skill will
    break first when Hubble retires an alias. Recommend the provider re-ground the skill on /v1//v2.

# Each row: the agent-facing tool -> the REST operationId that backs it. The tool's real input
