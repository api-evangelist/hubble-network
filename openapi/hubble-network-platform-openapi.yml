        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invitee_email
              properties:
                invitee_email:
                  type: string
                  format: email
                  description: Email address of the user whose invitation to revoke
      responses:
        '200':
          description: Invitation successfully revoked
          content:
            application/json:
              schema:
                type: object
                example: {}
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'


  /v1/org/{org_id}/webhooks:
    post:
      tags:
        - Packet Webhooks
      operationId: create-webhook-endpoint
      x-criticality: high
      summary: Create a Webhook Endpoint
      description: |
        Register an endpoint that can receive webhook events for packet data.
        
        **Required Scope:** `write-webhooks`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  $ref: '#/components/schemas/webhookURL'
                max_batch_size:
                  $ref: '#/components/schemas/webhookMaxBatchSize'
                name:
                  $ref: '#/components/schemas/webhookName'
      responses:
        '200':
          description: A registered webhook endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhookWithSecret'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

    get:
      tags:
        - Packet Webhooks
      operationId: list-registered-webhooks
      x-criticality: high
      summary: List Registered Webhooks
      description: |
        Retrieve a list of registered webhooks.
        
        **Required Scope:** `read-webhooks`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: A list of registered webhook endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/basicWebhook'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/webhooks/{webhook_id}:
    patch:
      tags:
        - Packet Webhooks
      operationId: update-webhook-endpoint
      x-criticality: high
      summary: Update a Webhook Endpoint
      description: |
        Update certain fields of a webhook endpoint.
        
        **Required Scope:** `write-webhooks`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/webhookIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                set_name:
                  $ref: '#/components/schemas/webhookName'
                set_max_batch_size:
                  $ref: '#/components/schemas/webhookMaxBatchSize'
                set_url:
                  $ref: '#/components/schemas/webhookURL'
      responses:
        '200':
          description: The updated webhook endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/basicWebhook'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

    delete:
      tags:
        - Packet Webhooks
      operationId: delete-webhook-endpoint
      x-criticality: high
      summary: Delete a Webhook Endpoint
      description: |
        Delete a webhook endpoint.
        
        **Required Scope:** `write-webhooks`
        Delete a webhook endpoint so that it will stop receiving traffic.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/webhookIdPathParam'
      responses:
        '200':
          description: The webhook has been deleted
          content:
            application/json:
              schema:
                type: object
                description: an empty object for now
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'


  /v1/org/{org_id}/webhooks/{webhook_id}/test:
    post:
      tags:
        - Packet Webhooks
      operationId: test-webhook-endpoint
      x-criticality: high
      summary: Send a Test Webhook
      description: |
        Send an example packet batch to the configured webhook URL to test webhook delivery
        (connectivity, authentication, and response handling). Uses the same request shape as
        live delivery (JSON packet batch plus `HTTP-X-HUBBLE-TOKEN` when a secret is configured).
        The example packet is ephemeral and is not persisted after one attempt.

        **Required Scope:** `write-webhooks`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/webhookIdPathParam'
      responses:
        '200':
          description: Result of the test webhook delivery attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/testWebhookResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'


  /v1/org/{org_id}/billing/invoices:
    get:
      tags:
        - Billing
      operationId: get-recent-invoices
      x-criticality: medium
      summary: Get Recent Invoices
      description: |
        Retrieve the most recent invoices for your organization.
        
        **Required Scope:** `read-billing-invoices`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: A page of invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        invoice_id:
                          type: string
                          description: the primary id for the invoice
                        invoice_number:
                          type: string
                          description: |
                            Customer-facing invoice number (e.g. Stripe `number`), matching what appears on the PDF.
                        issue_timestamp:
                          $ref: '#/components/schemas/utcTimestampNumber'
                        due_timestamp:
                          $ref: '#/components/schemas/utcTimestampNumber'
                        status:
                          type: string
                          enum:
                            - DRAFT
                            - PENDING
                            - COMPLETED
                          description: |
                            A status for the invoice. 
                            The invoice starts as a DRAFT and then transitions to PENDING when it is ready to be paid.
                            A fully paid invoice is then COMPLETED.
                        total_balance:
                          type: number
                          format: float
                          description: |
                            The total balance amount on the invoice. The value is based on the organization's currency.
                        remaining_balance:
                          type: number
                          format: float
                          description: |
                            The remaining balance due on the invoice. The value is based on the organization's currency.
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/billing/invoices/{invoice_id}/pdf:
    get:
      tags:
        - Billing
      operationId: get-invoice-pdf
      x-criticality: medium
      summary: Get Invoice PDF
      description: |
        Retrieve an invoice PDF.
        
        **Required Scope:** `read-billing-invoices`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
          description: The primary key for an invoice
      responses:
        '200':
          description: A PDF document for an invoice
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                description: the PDF contents
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/billing/usage:
    get:
      tags:
        - Billing
      operationId: get-billing-usage
      x-criticality: medium
      summary: Get Billing Usage
      description: |
        Retrieve the most recent billing usage for your organization.

        **Required Scope:** `read-billing-usage`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: A page of usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage:
                    type: array
                    items:
                      type: object
                      properties:
                        usage_timestamp:
                          $ref: '#/components/schemas/formattedTimestamp'
                        usage_type:
                          type: string
                          enum:
                            - Daily Active Devices
                            - Monthly Active Devices
                          description: |
                            The type of usage recorded.
                        usage_value:
                          type: integer
                          description: |
                            The usage value for this type and timestamp.
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/billing/active-devices:
    get:
      tags:
        - Billing
      operationId: get-billing-active-devices
      x-criticality: medium
      summary: List active devices for the current billing period
      description: |
        Returns the paginated list of devices that were active during the organization's
        current Stripe billing period. A device is considered active if its most recent
        packet timestamp falls within the period.

        Use the `Continuation-Token` header for cursor-based pagination (same pattern as
        `GET /v1/org/{org_id}/devices`).

        **Required Scope:** `read-billing-usage`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/continuationTokenHeader'
        - $ref: '#/components/parameters/limitQueryParam'
        - name: network_type
          in: query
          required: false
          schema:
            type: string
            enum: [terrestrial, satellite]
          description: |
            Filter devices by network type. Omit to include all network types.
            Requesting `satellite` requires the organization to have satellite access.
      responses:
        '200':
          description: Active devices for the billing period
          headers:
            Continuation-Token:
              $ref: '#/components/headers/ContinuationTokenHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingActiveDevicesResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/billing/subscription:
    get:
      tags:
        - Billing
      operationId: get-billing-subscription
      x-criticality: medium
      summary: Get current subscription / plan
      description: |
        Returns the organization's current self-serve subscription snapshot from Stripe (plan tier, status, billing period fields).

        Timestamps are **Hubble unix-microsecond** integers (not Stripe's second-precision Unix times).

        **Required Scope:** `read-billing-invoices`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: Subscription snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscription'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/billing/payment-method:
    get:
      tags:
        - Billing
      operationId: get-billing-payment-method
      x-criticality: medium
      summary: List saved card payment methods
      description: |
        Returns every **card** payment method attached to the org's Stripe customer (self-serve; no manual Dashboard "invoice default" required).

        `default_payment_method_id` is the Stripe Customer's **invoice** default (`pm_...`) when set; it may be empty even when `payment_methods` is non-empty.

        **Required Scope:** `read-billing-invoices`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: Saved cards (empty array if none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPaymentMethodsResponse'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    orgIdPathParam:
      name: org_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/orgId'
      description: Your organization ID

    deviceIdPathParam:
      name: device_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/deviceId'

    deviceKeyFormatQueryParam:
      name: key_format
      in: query
      required: false
      schema:
        type: string
        enum: [base64, hex]
        default: base64
      description: |
        Encoding for `device.key` in the response. `base64` (default) returns standard Base64;
        `hex` returns a lowercase hexadecimal string.

    webhookIdPathParam:
      name: webhook_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/webhookId'

    userIdPathParam:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The ID of the user

    limitQueryParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        maximum: 1000
        minimum: 10
        default: 250
      description: A limit for the page size of devices

    filterCreatedTSQueryParam:
      name: filter_created_ts
      in: query
      required: false
      schema:
        type: string
      description: |
        Filter devices by creation timestamp (e.g., filter_created_ts=between:1000:2000)
        Timestamps are in seconds since the Unix epoch.
        The only supported filtering operator currently is `between`. 

    filterMostRecentPacketTSQueryParam:
      name: filter_most_recent_packet_ts
      in: query
      required: false
      schema:
        type: string
      description: | 
        Filter devices by most recent packet timestamp (e.g., filter_most_recent_packet_ts=between:1000:2000)
        Timestamps are in seconds since the Unix epoch.
        The most recent packet value is only updated periodically.
        The only supported filtering operator currently is `between`. 

    sortFieldQueryParam:
      name: sort_field
      in: query
      required: false
      schema:
        type: string
        enum: [created_ts, most_recent_packet_ts]
      description: Field to sort devices by

    sortAscendingQueryParam:
      name: sort_ascending
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: Sort order (true for ascending, false for descending)

    continuationTokenHeader:
      name: Continuation-Token
      in: header
      required: false
      schema:
        type: string
      description: A token to indicate how to continue paging

    contentTypeJsonHeader:
      name: Content-Type
      in: header
      schema:
        type: string
      description: An indication that the payload is JSON
      example: application/json

    webhookSecretHeader:
      name: HTTP-X-HUBBLE-TOKEN
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/webhookSecret'
      description: |
        A confidential, unique string generated for your webhook endpoint to validate that the request came from Hubble.

    startQueryParam:
      name: start
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/utcTimestampInteger'
      description: |
        UTC timestamp (in seconds) indicating when to start retrieving packets. 
        This timestamp corresponds to when the packet was received by the network.
        If omitted, defaults to 7 days before the current UTC time.

    endQueryParam:
      name: end
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/utcTimestampInteger'
      description: |
        UTC timestamp (in seconds) indicating when to end retrieving packets.
        This timestamp corresponds to when the packet was received by the network.
        If omitted, defaults to empty (meaning the pagination will continue indefinitely).
        If specified, pagination will continue until all packets received prior to the timestamp have been returned.

    deviceIdQueryParam:
      name: device_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/deviceId'
      description: |
        Filter packets to a specific device

    retryAfterHeader:
      name: Retry-After
      in: header
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 300
      description: |
        The number of seconds to wait to attempt a retry.
        When attached to a 200, this is a suggestion because the most recent data has been retrieved already.
        When attached to a 429, this delay is a recommendation to reduce repeat 429s.

    pageNumberQueryParam:
      name: page_number
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: The page number of items to return

    pageSizeQueryParam:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 5
        maximum: 100
        default: 10
      description: The maximum number of items to return in a single request

    metricsDaysBackQueryParam:
      name: days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 1
      description: |
        The number of days of metrics to include in the request.
        
        The maximum value is further restricted when small `time_interval` values are used.
        The maximum number of total metric buckets is 365.

    metricsTimeIntervalQueryParam:
      name: time_interval
      in: query
      required: false
      schema:
        type: string
        enum:
          - hour
          - day
          - month
      description: |
        The time interval for the metric buckets.
        If not provided, a default value is selected based on the `days` parameter:
        
        | days        | time_interval |
        | ----------- | ------------- |
        | [1 => 1)    | hour          |
        | [2 => 31]   | day           |
        | [32 => 365] | month         |
        
        **Partial buckets:** The most recent bucket of metrics is a "partial" bucket depending on the interval - partial because it doesn't span a full time_interval yet. 
        (e.g. 10:00pm -> 10:36pm for `hour`, June 3rd 12:00am -> June 3rd 10:36pm for `day`, June 1st 12:00am -> June 3rd 10:36pm for `month`).
        The older buckets are always "complete" buckets.
        (e.g. 09:00pm -> 10:00pm for `hour`, June 2nd 12:00am -> June 3rd 12:00am for `day`, May 1st 12:00am -> June 1st 12:00am for `month`).
        
        **Edge cases:** If `days` is not large enough to include a full `month` bucket, days is increased in the backend. 
        For example, querying days=90 with a `month` time_interval on June 13th, 2025 will return "complete" March, April, and May buckets and a "partial" June bucket.
        Similarly, when querying for days=7 with a `day` time_interval on June 13th, 2025 at 6:00am will return "complete" June 6th, 7th, 8th, 9th, 10th, 11th, and 12th buckets and a "partial" June 13th bucket.

    filterTagsQueryParam:
      name: filter_tags
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          description: | 
            A tag to match against. For example: _env:production.
      description: |
        A set of device **platform tags** specifying which packets to include.
        Only platform tags are queryable: `_env:production`, `_env:sandbox`.
        The query param can be used multiple times to form a list of tags.
        Packet matching criteria uses AND logic when different tag keys are used in a list of tags, and OR logic when the same tag key is used more than once.

  headers:
    ContinuationTokenHeader:
      description: A token to indicate how to continue paging
      schema:
        type: string

    RetryAfterHeader:
      description: |
        The number of seconds to wait to attempt a retry.
        When attached to a 200, this is a suggestion because the most recent data has been retrieved already.
        When attached to a 429, this delay is a recommendation to reduce repeat 429s.
      schema:
        type: integer
        minimum: 0
        maximum: 300

  schemas:
    orgId:
      type: string
      format: uuid
      description: The ID for an organization

    BillingSubscription:
      type: object
      required:
        - plan
        - status
      properties:
        plan:
          type: string
          enum:
            - GROWTH
            - SCALE
            - ENTERPRISE
            - SANDBOX
        status:
          type: string
          description: Stripe subscription status, or `none` when there is no subscription.
        current_period_start:
          type: integer
          format: int64
          description: Start of the current billing period (Hubble unix-microsecond timestamp), if applicable.
        current_period_end:
          type: integer
          format: int64
          description: End of the current billing period (Hubble unix-microsecond timestamp), if applicable.
        next_payment_date:
          type: integer
          format: int64
          description: Approximate next charge date (Hubble unix-microsecond timestamp), if applicable.
        cancel_at_period_end:
          type: boolean
        prepaid_devices:
          type: integer
        price_monthly_cents:
          type: integer
          format: int64
        overage_per_device_cents:
          type: integer
          format: int64

    BillingPaymentMethodCard:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Stripe PaymentMethod id (`pm_...`)
        type:
          type: string
          example: card
        brand:
          type: string
          example: visa
        last4:
          type: string
        exp_month:
          type: integer
          format: int64
        exp_year:
          type: integer
          format: int64

    BillingPaymentMethodsResponse:
      type: object
      required:
        - payment_methods
      properties:
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/BillingPaymentMethodCard'
        default_payment_method_id:
          type: string
          description: Customer invoice_settings.default_payment_method when set

    BillingActiveDevicesResponse:
      type: object
      required:
        - devices
        - period_start
        - period_end
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/BillingActiveDevice'
        period_start:
          type: string
          format: date-time
          description: Start of the current billing period (ISO 8601).
        period_end:
          type: string
          format: date-time
          description: End of the current billing period (ISO 8601).

    BillingActiveDevice:
      type: object
      required:
        - device_id
        - name
      properties:
        device_id:
          type: string
          description: The device identifier.
        name:
          type: string
          description: The device display name.
        network_type:
          type: string
          enum: [terrestrial, satellite]
          description: The network on which the device was most recently active.
        last_active:
          type: number
          format: double
          description: Unix timestamp (seconds, fractional) of the device's most recent packet.

    apiKey:
      type: string
      description: An API key

    apiKeyName:
      type: string
      description: A name for an API Key
      maxLength: 250

    apiKeyId:
      type: string
      description: An ID for an API key

    apiKeyExpiration:
      type: integer
      format: int64
      description: |
        An UTC second-precision timestamp formatted as an integer.
        Can be set to 0 to indicate that there is no expiration.

    deviceName:
      type: string
      description: Assigned name for the device
      maxLength: 250

    deviceId:
      type: string
      format: uuid
      description: Primary UUID identifier for a registered device

    deviceTags:
      type: object
      additionalProperties:
        type: string
      description: |
        Tags are user-defined key/value pairs that can be attributed to a device. 
        A device may have up to 10 tags.
        **Custom tags:** create your own tags with `key` length up to 32 characters and `value` length up to 128 characters.
        **Platform tags:** use Hubble-defined tags to organize devices.
        - `_env` tag: `production` indicates if a device belongs to the live environment, and `sandbox` for the test environment. A device will always have an `_env` tag assigned.
      example:
        _env: production

    eidRotation:
      type: object
      description: |
        Configuration for EID (Ephemeral ID) rotation on a device.
        EID rotation allows devices to use rotating ephemeral identifiers based on the specified counter source.
        When not specified, devices will use the UNIX_TIME counter source which relies on the device knowing an accurate epoch time.
        The DEVICE_UPTIME counter source enables EID rotation without requiring a real-time clock.

      properties:
        counter_source:
          type: string
          enum: [UNIX_TIME, DEVICE_UPTIME]
          description: |
            The counter source used for EID rotation.
            * `UNIX_TIME` - Counter is based on the current Unix (epoch) time.
            * `DEVICE_UPTIME` - Counter is based on the device's uptime.
        period_exponent:
          type: integer
          minimum: 10
          maximum: 15
          default: 15
          description: |
            Base-2 exponent of the EID rotation period in seconds, used only with `encryption` of "AES-128-EAX" (IN100 protocol).
            Matches the IN100 hardware's configuration field. Must be between 10 (~17 minutes) and 15 (~9 hours) inclusive.

    utcTimestampNumber:
      type: number
      format: double
      description: An UTC second-precision timestamp formatted as a floating point number

    utcTimestampInteger:
      type: integer
      format: int64
      description: An UTC second-precision timestamp formatted as an integer

    formattedTimestamp:
      type: string
      format: date-time
      description: | 
        Start of the bucket in ISO 8601 format.
        For example: `2025-04-25T14:01:54Z`. 

    metricsSuccessRate:
      type: number
      format: float
      description: |
        Success rate of requests (0-1). 
        When total requests is 0, the success rate defaults to 1.0 or 100%.

    webhookId:
      type: string
      description: An identifier for a webhook

    webhookName:
      type: string
      description: A name/description for a webhook
      maxLength: 250

    webhookSecret:
      type: string
      description: | 
        A confidential, unique string generated for your webhook endpoint to validate that the request came from Hubble.
        Hubble will send this token in the HTTP header `HTTP-X-HUBBLE-TOKEN` when making HTTPS requests to your endpoint.

    webhookURL:
      type: string
      description: A webhook url
      maxLength: 2000

    webhookMaxBatchSize:
      type: integer
      description: The maximum number of packets that Hubble will batch into one webhook request
      default: 100
      minimum: 10
      maximum: 1000

    testWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the webhook endpoint returned a successful HTTP status code
        status_code:
          type: integer
          description: HTTP status code returned by the webhook endpoint, if a response was received
        error:
          type: string
          description: Error details when the test delivery failed

    legacyWebhook:
      type: object
      properties:
        url:
          $ref: '#/components/schemas/webhookURL'
        max_batch_size:
          $ref: '#/components/schemas/webhookMaxBatchSize'

    basicWebhook:
      type: object
      allOf:
        - $ref: '#/components/schemas/legacyWebhook'
        - type: object
          properties:
            webhook_id:
              $ref: '#/components/schemas/webhookId'
            org_id:
              $ref: '#/components/schemas/orgId'
            name:
              $ref: '#/components/schemas/webhookName'

    webhookWithSecret:
      type: object
      allOf:
        - $ref: '#/components/schemas/basicWebhook'
        - type: object
          properties:
            secret:
              $ref: '#/components/schemas/webhookSecret'

    userRole:
      type: string
      enum: [admin, member]
      description: The role a user is assigned within an organization

    organizationUser:
      type: object
      description: A user within an organization
      properties:
        user_id:
          type: string
          description: an id for the user
        email:
          type: string
          format: email
          description: the user's email address
        email_confirmed:
          type: boolean
          description: whether the user's email has been confirmed
        first_name:
          type: string
          description: the user's first name
        last_name:
          type: string
          description: the user's last name
        created_at:
          $ref: '#/components/schemas/utcTimestampInteger'
        last_active_at:
          $ref: '#/components/schemas/utcTimestampInteger'
        role:
          $ref: '#/components/schemas/userRole'

    invitation:
      type: object
      description: An invitation to join an organization
      required:
        - invitee_email
        - role
        - created_at
        - expires_at
      properties:
        invitee_email:
          type: string
          format: email
          description: Email address of the invited user
        inviter_email:
          type: string
          format: email
          description: Email address of the user who sent the invitation
        created_at:
          $ref: '#/components/schemas/utcTimestampInteger'
          description: Timestamp when the invitation was created
        expires_at:
          $ref: '#/components/schemas/utcTimestampInteger'
          description: Timestamp when the invitation expires
        role:
          $ref: '#/components/schemas/userRole'
          description: Role that will be assigned to the invited user

    organizationName:
      type: string
      description: The name of the organization

    authScope:
      type: string
      enum:
        - read-api-keys
        - write-api-keys
        - read-users
        - write-users
        - read-organization-metadata
        - write-organization-metadata
        - read-devices
        - write-devices
        - read-invitations
        - write-invitations
        - read-packets
        - read-platform-metrics
        - read-billing-usage
        - read-billing-invoices
        - read-webhooks
        - write-webhooks
      description: Authorization scope for API key permissions

    apiKeyItem:
      type: object
      description: An API Token used to authenticate with the Hubble Platform
      properties:
        key_id:
          $ref: '#/components/schemas/apiKeyId'
        key_name:
          $ref: '#/components/schemas/apiKeyId'
        created_at:
          $ref: '#/components/schemas/utcTimestampInteger'
        expires_at_seconds:
          $ref: '#/components/schemas/apiKeyExpiration'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/authScope'
          description: List of authorization scopes assigned to this API key

    address:
      type: object
      properties:
        street_address:
          type: string
          description: The first line of a street address
          maxLength: 250
        street_address_line_two:
          type: string
          description: The optional second line of a street address
          maxLength: 250
        city:
          type: string
          description: A city that the address relates to
          maxLength: 100
        state:
          type: string
          description: A state that the address relates to
          maxLength: 100
        country:
          type: number
          description: A country code defined by [ISO-3166](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes).

    timezone:
      type: string
      description: A timezone string defined in the [IANA Time Zone](https://www.iana.org/time-zones) database.

    contactInfo:
      type: object
      properties:
        phoneNumber:
          type: string
          description: A phone number matching the [E.164](https://en.wikipedia.org/wiki/E.164) specification
        email:
          type: string
          description: An email address

    installLocation:
      type: object
      description: |
        Fixed installation location of a device.
        To clear a previously set location, send lat/long of 0,0.
      required: [lat, long]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude in Decimal Degrees DDD.DDDDD°
        long:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude in Decimal Degrees DDD.DDDDD°
        location_name:
          type: string
          maxLength: 500
          description: Human-readable label for the location.

    deviceEncryption:
      type: string
      enum: [AES-256-CTR, AES-128-CTR, AES-128-EAX, NONE]
      description: Encryption mode configured for the device at registration.

    organizationDevice:
      type: object
      required: [name, id, created_ts, tags]
      properties:
        name:
          $ref: '#/components/schemas/deviceName'
        id:
          $ref: '#/components/schemas/deviceId'
        created_ts:
          $ref: '#/components/schemas/utcTimestampInteger'
        tags:
          $ref: '#/components/schemas/deviceTags'
        encryption:
          $ref: '#/components/schemas/deviceEncryption'
        eid_rotation:
          $ref: '#/components/schemas/eidRotation'
        install_location:
          $ref: '#/components/schemas/installLocation'
        most_recent_packet:
          type: object
          description: |
            Most recent packet metadata for different network types.
            The most recent packet value is only updated periodically.
          properties:
            satellite:
              type: object
              nullable: true
              properties:
                timestamp:
                  $ref: '#/components/schemas/utcTimestampNumber'
                  description: Unix timestamp of a recent satellite packet
                location:
                  $ref: '#/components/schemas/latLongLocation'
                  description: Location data from a recent satellite packet
            terrestrial:
              type: object
              nullable: true
              properties:
                timestamp:
                  $ref: '#/components/schemas/utcTimestampNumber'
                  description: Unix timestamp of a recent terrestrial packet
                location:
                  $ref: '#/components/schemas/latLongLocation'
                  description: Location data from a recent terrestrial packet


    organization:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/organizationName'
        org_id:
          $ref: '#/components/schemas/orgId'
        contact_info:
          $ref: '#/components/schemas/contactInfo'
        address:
          $ref: '#/components/schemas/address'
        timezone:
          $ref: '#/components/schemas/timezone'
        org_type:
          $ref: '#/components/schemas/orgType'
        production_org_id:
          allOf:
            - $ref: '#/components/schemas/orgId'
          description: |
            The org_id of the paired production organization. Only set when
            org_type is sandbox and the sandbox is paired to a production org.

    orgType:
      type: string
      enum:
        - sandbox
        - production
      description: Whether this organization is a sandbox or production organization

    location:
      type: object
      required:
        - latitude
        - longitude
        - altitude
        - timestamp
      properties:
        latitude:
          type: number
          description: Latitude in Decimal Degrees DDD.DDDDD°
        longitude:
          type: number
          description: Longitude in Decimal Degrees DDD.DDDDD°
        altitude:
          type: number
          description: Altitude in meters for the provided gps coordinates
        horizontal_accuracy:
          type: number
          description: Horizontal accuracy in meters for the provided gps coordinates
        vertical_accuracy:
          type: number
          description: Vertical accuracy in meters for the provided gps coordinates
        timestamp:
          $ref: '#/components/schemas/utcTimestampNumber'

    latLongLocation:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          description: Latitude in Decimal Degrees DDD.DDDDD°
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Longitude in Decimal Degrees DDD.DDDDD°
          format: double
          minimum: -180
          maximum: 180

    advertisement:
      description: Advertisement packet(s) associated with the provided location
      type: object
      required:
        - payload
        - rssi
        - timestamp
      properties:
        payload:
          type: string
          description: Raw advertisement packet in Base64 format
        rssi:
          type: number
          description: Signal strength in dBm
        timestamp:
          $ref: '#/components/schemas/utcTimestampNumber'

    gateway:
      type: object
      description: |
        Metadata about the scanning gateway that received this packet — the relay
        that detected the BLE advertisement, not the device that emitted it.
        Only present on self-provided packets (`provider_id == org_id`) where
        gateway context was attached at ingest. Both fields are optional.
      properties:
        gateway_id:
          type: string
          format: uuid
          description: |
            Stable unique identifier of the gateway device that received the packet.
            This is the gateway UUID issued at registration time and is consistent
            across all packets from the same gateway.
        service_id:
          type: string
          description: |
            Normalized 16-bit BLE service UUID that the advertisement was scanned
            under (lowercase hex, e.g. `fca6` for Hubble packets). Identifies which
            BLE service profile the gateway matched when it captured this packet.
          example: "fca6"

    packet:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/location'
        device:
          type: object
          required:
            - id
            - payload
            - timestamp
          properties:
            id:
              $ref: '#/components/schemas/deviceId'
            name:
              $ref: '#/components/schemas/deviceName'
            tags:
              $ref: '#/components/schemas/deviceTags'
            payload:
              type: string
              description: A packet's decrypted payload in Base64 format
            rssi:
              type: number
            timestamp:
              $ref: '#/components/schemas/utcTimestampNumber'
            counter:
              type: number
              description: |
                The time-based counter associated with this packet.
            sequence_number:
              type: number
              description: | 
                The sequence number of this packet
        network_type:
          type: string
          enum: [TERRESTRIAL, SATELLITE]
        gateway:
          $ref: '#/components/schemas/gateway'

    packetBatch:
      type: object
      properties:
        packets:
          type: array
          items:
            $ref: '#/components/schemas/packet'

    errorResponse:
      type: object
      properties:
        code:
          type: integer
          description: The HTTP status code
        description:
          type: string
          description: |
            A description for the error.
            For user errors, we attempt to be as descriptive as possible to help with diagnosing the issue.
            For internal errors, the error description is only indicates that a retry should occur but we log the full error so that we can diagnose it.
            Error descriptions can change over time and should not be programmed against.
        name:
          type: string
          enum:
            - Bad Request
            - Unauthorized
            - Not Found
            - Too Many Requests
            - Internal Server Error
          description: |
            `name` is a short name for the error.

  responses:
    ErrorBadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            code: 400
            description: "The request could not be understood by the server due to malformed syntax."
            name: "Bad Request"
    ErrorInternalServer:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            code: 500
            description: "An unknown error has occurred."
            name: "Unknown"
    ErrorUnauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            code: 401
            description: "Authentication is required and has failed or has not been provided."
            name: "Unauthorized"
    ErrorForbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            code: 403
            description: "The authenticated principal is not allowed to perform this operation."
            name: "Forbidden"
    ErrorNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
          example:
            code: 404
            description: "The requested resource was not found."
            name: "Not Found"
