openapi: 3.0.3
# updated 2026-07-28
info:
  title: Hubble Platform API
  description: |
    The Hubble platform is built API-first. Use our Cloud API to manage your devices
    and access device data programmatically. 
    We've designed our API following RESTful principles. 
    Each endpoint returns standard HTTP status codes and may include JSON payloads.

    ---
    
    ## API Access
    Use API Keys to authenticate with the Hubble Cloud API for your organization. 

    ### Generate an API Key
    Log in to your Hubble dashboard. Navigate to **Developer Tools > API Tokens** to create a new API Key. 
    Provide a name for the token, and set an appropriate expiration date for temporary access.

    ### Organization ID
    You will need `org_id` to make API requests. From your Hubble dashboard, navigate to 
    **Developer Tooks > API Tokens**, or **Organization Settings**, to find your Organization ID. 

    ### Authorization Scopes
    API endpoints require specific authorization scopes to perform the intended operation. 
    **Required Scope** is always provided in the API documentation.
    
    API Keys can be created with specific authorization scopes that control what operations the key can perform. 
    If no scopes are specified, the key will be created with all available scopes (admin-level access).
   
    | **Scope**                   | **Access**                                     |
    |------------------------------|-------------------------------------------------|
    | **read-api-keys**            | View API keys and their metadata               |
    | **write-api-keys**           | Create, update, and delete API keys            |
    | **read-users**               | View user information and roles                |
    | **write-users**              | Add, update, and remove users from the organization |
    | **read-organization-metadata** | View organization details and settings       |
    | **write-organization-metadata** | Update organization information            |
    | **read-devices**             | View device information and status             |
    | **write-devices**            | Register and manage devices                    |
    | **read-invitations**         | View pending invitations                       |
    | **write-invitations**        | Create and revoke user invitations             |
    | **read-packets**             | Access packet data and retrieval endpoints     |
    | **read-platform-metrics**    | View platform metrics and analytics            |
    | **read-billing-usage**       | View billing usage information                 |
    | **read-billing-invoices**    | View billing invoices                          |
    | **read-webhooks**            | View webhook configurations                    |
    | **write-webhooks**           | Create and manage webhook endpoints            |
        
    **Example Scope Combinations**
    - Create a key with read-only access: `["read-api-keys", "read-users", "read-devices"]`
    - Create a key for device management: `["read-devices", "write-devices"]`
    - Create a key for user management: `["read-users", "write-users", "read-invitations", "write-invitations"]`
        
    **Best Practices for Data Security**
    - Create keys with the minimum required scopes for your use case
    - Regularly review and rotate API keys
    - Use descriptive names for your keys to track their purpose
    - Set appropriate expiration dates for temporary access    
    
    ---

    ## Import API Definition
    You can quickly import the Hubble Cloud API into your preferred developer environment (such as Postman or Insomnia) using our **public OpenAPI definition**.
    Simply download or import the YAML file directly:

    [https://hubble.com/docs/openapi.yaml](https://hubble.com/docs/openapi.yaml)
    
    ---
    
    ## Pagination
    When the number of objects requested exceeds the maximum page size for an endpoint, the API response will be paginated. 
    This means you will receive a subset of the total results, along with a `Continuation-Token` in the Response Header that can be used to fetch subsequent subsets.

    To retrieve the next set of data, you must use the provided `Continuation-Token` in the Request Header of your next API call to the same endpoint. 
    Continue using the provided token in each successive request until no `Continuation-Token` is returned, which indicates you have retrieved all available data.
    
    ---
    
    ## Rate Limits
    The Hubble Cloud API follows a leaky bucket approach to rate limiting. Endpoints are rate limited to three (3) requests per second. 
    Your organization is limited to a total of 15 requests per second. 
    If you exceed this limit, you will receive a 429 status code. 
    We recommend backoff retry logic to stay within the limit.
    
    ---
    
    ## Request Headers
    All HTTP responses will include a `X-Request-ID` header that is logged internally and can be used for tracing/debugging a particular API request. 
    All HTTP requests can include a `X-Request-ID` header which will be logged and mapped to the responses' `X-Request-ID` header. 
    
    Share Request Headers whenever troubleshooting an API issue with Hubble Support.

    ---
    
    ## Status Codes
    The Hubble Cloud API returns the following HTTP status codes: `200`, `400`, `401`, `403`, `404`, `429` and `500`. 
    Use the tailored message returned with each status code for insight in the specific context of the endpoint you are attempting to access.

    ---
    
    ## Versioning
    Our cloud backend follows a rolling release model. This means:
    - **Continuous Deployment**: New features, security updates, and performance improvements are automatically rolled out.
    - **Backward Compatibility**: Cloud updates are designed to be compatible with devices running firmware/SDK versions within our active or maintained support windows.
    - **Transparent Change Management**: Release notes and changelogs are published regularly so you can track enhancements and understand any adjustments that might affect integrations.
    - **Versioned Public API**: The Cloud API uses basic major versioning in the url paths (`/v1/...`, `/v2/...` etc.). Major backwards incompatible changes will be made by creating a version of the endpoint with a higher version and communicating with customers to migrate. The legacy `/api/...` and `/api/v2/...` paths remain fully supported as aliases for `/v1/...` and `/v2/...` respectively, so previous versions will be supported for a minimum of 1 year.

    ---

  version: 1.0.0
  
servers:
  - url: https://api.hubble.com
    description: Production

security:
  - BearerAuth: []

paths:
  /v1/org/{org_id}/check:
    get:
      tags:
        - API Keys
      operationId: validate-api-key
      x-criticality: high
      summary: Validate an API Key
      description: Confirm your API key is valid.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: API key validated
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id:
                    $ref: '#/components/schemas/orgId'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/key:
    post:
      tags:
        - API Keys
      operationId: provision-api-key
      x-criticality: high
      summary: Provision an API Key
      description: |
        Provision a new API Key for your organization.
        
        **Required Scope:** `write-api-keys`
        
        ### Authorization Scopes
        API Keys can be created with specific authorization scopes that control what operations the key can perform. 
        If no scopes are specified, the key will be created with all available scopes (admin-level access).
        See the Cloud API "Introduction" for a complete list authorization scopes.

        ### Expiration Date
        Set an appropriate expiration date for temporary API access. For no expiration, set to `0`.
        
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/contentTypeJsonHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/apiKeyName'
                expires_at_seconds:
                  $ref: '#/components/schemas/apiKeyExpiration'
                scopes:
                  $ref: '#/components/schemas/authScope'
                  example: ["read-api-keys", "read-users", "read-devices"]
      responses:
        '200':
          description: API key provisioned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/apiKeyItem'
                  - type: object
                    properties:
                      key:
                        $ref: '#/components/schemas/apiKey'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

    get:
      tags:
        - API Keys
      operationId: list-api-keys
      x-criticality: high
      summary: List all API Keys
      description: |
        List all valid API Keys for your organization.
        
        **Required Scope:** `read-api-keys`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/apiKeyItem'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/key/{key_id}:
    delete:
      tags:
        - API Keys
      operationId: delete-api-key
      x-criticality: high
      summary: Delete an API Key
      description: |
        Permanently delete an API Key from your organization.
        
        **Required Scope:** `write-api-keys`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - name: key_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/apiKeyId'
          description: API key ID
      responses:
        '200':
          description: API key deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id:
                    $ref: '#/components/schemas/apiKeyId'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

    patch:
      tags:
        - API Keys
      operationId: update-api-key
      x-criticality: high
      summary: Update an API Key
      description: |
        Update metadata for an API key, including name, authorization scopes, and expiration time.
        
        **Required Scope:** `write-api-keys`
        
        ### Authorization Scopes
        You may update the scopes assigned to an API key to change its permissions. See the Cloud API "Introduction" for a complete list authorization scopes.
        
        ### Expiration Time
        You may update the expiration time for an API key. Set to 0 to remove expiration (key will never expire).
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - name: key_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/apiKeyId'
          description: API key ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                set_name:
                  $ref: '#/components/schemas/apiKeyName'
                set_scopes:
                  $ref: '#/components/schemas/authScope'
                  example: ["read-api-keys", "read-users", "read-devices"]
                set_expires_at_seconds:
                  $ref: '#/components/schemas/apiKeyExpiration'
      responses:
        '200':
          description: API Key Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiKeyItem'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/key_scopes:
    get:
      tags:
        - API Keys
      operationId: list-key-scopes
      x-criticality: high
      summary: List Key Scopes
      description: |
        Retrieve a list of all available authorization scopes that can be assigned to API keys.
        This endpoint returns scope IDs and human-readable display names.
        
        **Required Scope:** `read-api-keys`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: List of available scopes
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes:
                    type: array
                    items:
                      type: object
                      properties:
                        scope_id:
                          $ref: '#/components/schemas/authScope'
                          description: The scope identifier used in API requests
                        display_name:
                          type: string
                          description: Human-readable name for the scope
                      required:
                        - scope_id
                        - display_name
                    description: List of all available authorization scopes
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}:
    patch:
      tags:
        - Organizations
      operationId: update-organization-metadata
      x-criticality: medium
      summary: Update Organization Metadata
      description: |
        Update metadata for an organization.
        
        **Required Scope:** `write-organization-metadata`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                All of the potential update operations. 
                Each field is optional but the request must have at least one field set to perform an update.
              properties:
                set_name:
                  $ref: '#/components/schemas/organizationName'
                set_address:
                  $ref: '#/components/schemas/address'
                set_contact_info:
                  $ref: '#/components/schemas/contactInfo'
                set_timezone:
                  $ref: '#/components/schemas/timezone'

      responses:
        '200':
          description: "Updated Organization"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

    get:
      tags:
        - Organizations
      operationId: retrieve-organization-metadata
      x-criticality: medium
      summary: Retrieve Organization Metadata
      description: |
        Retrieve metadata for an organization.
        
        **Required Scope:** `read-organization-metadata`
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      responses:
        '200':
          description: "An Organization"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/organization'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v2/org/{org_id}/devices:
    post:
      tags:
        - Devices
      operationId: register-new-devices
      x-criticality: high
      summary: Register New Devices
      description: |
        Register one or more devices to your organization.

        **Required Scope:** `write-devices`

        ## Overview
        This endpoint supports bulk device registration with specified encryption mode, and custom naming and tagging.

        ## Device Encryption Modes

        ### Set Key Length
        Set encryption key length to match your device firmware's encryption library requirement:
        * **256-bit key** (32 bytes): set `encryption` to "AES-256-CTR"
        * **128-bit key** (16 bytes): set `encryption` to "AES-128-CTR"
        * **128-bit key, IN100 protocol** (16 bytes): set `encryption` to "AES-128-EAX"

        ### Set Counter Source for EID Rotation
        The Hubble Device SDK rotates through ephemeral IDs (EID) so that devices are anonymous on the network.
        Specify the `counter_source` based on your hardware capabilities:      
        * Use "UNIX_TIME" for **time-based encryption**, e.g. for devices with a real time clock (RTC). **This is the default value.**
        * Use "DEVICE_UPTIME" for **timeless encryption**, e.g. using the device uptime counter to rotate EIDs.

        ### Set EID Rotation Period (AES-128-EAX only)
        For the IN100 protocol (`encryption` of "AES-128-EAX"), you may optionally override the EID rotation period with `eid_rotation.period_exponent`: the base-2 exponent of the rotation period in seconds (matches the IN100 configuration field). 
        Must be between 10 and 15 inclusive. 
        The period defaults to `period_exponent: 15`, corresponding to 32,768 seconds (~9 hours).
        
        ## Device Metadata
        You can optionally provide `names` and `tags` for each device being provisioned:
        * `names`: An array of device names.
        * `tags`: An array of device tags.
        
        ## Device Key
        By default `device.key` is returned encoded in standard Base64 format, and is automatically compatible with the Hubble Device SDK. 
        Pass `key_format=hex` to receive device.key as a lowercase hexadecimal string instead.
        
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/deviceKeyFormatQueryParam'
        - $ref: '#/components/parameters/contentTypeJsonHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ encryption ]
              properties:
                n_devices:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 1
                  description: Number of devices to provision
                encryption:
                  $ref: '#/components/schemas/deviceEncryption'
                names:
                  type: array
                  items:
                    $ref: '#/components/schemas/deviceName'
                  description: |
                    Optional array of device names. 
                    If provided, the length must match the number of devices being provisioned.
                tags:
                  type: array
                  items:
                    $ref: '#/components/schemas/deviceTags'
                  description: | 
                    Optional array of tag maps for each device. 
                    If provided, the length must match the number of devices being provisioned.
                eid_rotation:
                  $ref: '#/components/schemas/eidRotation'
                  description: |
                    Ephemeral ID (EID) rotation configuration for provisioned devices.
                    `counter_source` default is "UNIX_TIME".
                install_locations:
                  type: array
                  items:
                    $ref: '#/components/schemas/installLocation'
                  description: |
                    Optional array of install locations for each provisioned device.
                    If provided, the length must match the number of devices being provisioned.
              example:
                n_devices: 1
                encryption: AES-256-CTR
                names:
                  - my-device
            examples:
              encryptedProtocolUnixTime:
                summary: AES-CTR + UNIX_TIME eid_rotation
                description: |
                  Default-style encrypted device. Omit `eid_rotation` or set only `counter_source` to `UNIX_TIME`.
                value:
                  n_devices: 1
                  encryption: AES-256-CTR
                  names:
                    - sensor-001
              encryptedProtocolDeviceUptime:
                summary: AES-CTR + DEVICE_UPTIME eid_rotation
                description: |
                  Configure a device to leverage its uptime as the EID rotation counter source used for encryption.
                value:
                  n_devices: 1
                  encryption: AES-128-CTR
                  names:
                    - uptime-sensor
                  eid_rotation:
                    counter_source: DEVICE_UPTIME
              encryptedProtocolIN100:
                summary: AES-128-EAX (IN100 protocol) with DEVICE_UPTIME
                description: |
                  Provision a device using the IN100 protocol (AES-EAX authenticated encryption).
                value:
                  n_devices: 1
                  encryption: AES-128-EAX
                  names:
                    - in100-sensor
                  eid_rotation:
                    counter_source: DEVICE_UPTIME
                    period_exponent: 15
      responses:
        '200':
          description: Devices provisioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          $ref: '#/components/schemas/deviceId'
                        name:
                          $ref: '#/components/schemas/deviceName'
                        created_ts:
                          type: integer
                          format: int64
                          description: Unix timestamp (in seconds) when the device was created
                        tags:
                          $ref: '#/components/schemas/deviceTags'
                        protocol:
                          type: object
                          description: Protocol configuration for the device
                          properties:
                            terrestrial:
                              type: object
                              properties:
                                version:
                                  type: integer
                                  format: uint8
                                  description: Protocol version number
                        eid_rotation:
                          $ref: '#/components/schemas/eidRotation'
                          description: EID rotation configuration for the device
                        network_id:
                          type: integer
                          description: Network ID for the device, if applicable
                        key:
                          type: string
                          description: |
                            Encryption key for the device, when applicable.
                            Default Base64-encoded bytes (when key_format omitted or key_format=base64).
                            With key_format=hex: lowercase hexadecimal string.
                        install_location:
                          $ref: '#/components/schemas/installLocation'
              examples:
                encryptedProtocolUnixTime:
                  summary: Matches AES-CTR + UNIX_TIME eid_rotation
                  value:
                    devices:
                      - device_id: "6ea53e36-b7fb-429f-8c2e-d536cab71089"
                        name: sensor-001
                        created_ts: 1734567890
                        tags:
                          _env: production
                        protocol:
                          terrestrial:
                            version: 0
                        eid_rotation:
                          counter_source: UNIX_TIME
                        key: "YWJjZGVmZw=="

                encryptedProtocolDeviceUptime:
                  summary: Matches AES-CTR + DEVICE_UPTIME eid_rotation
                  value:
                    devices:
                      - device_id: "7fb53e36-b7fb-429f-8c2e-d536cab71090"
                        name: uptime-sensor
                        created_ts: 1734567891
                        tags:
                          _env: production
                        protocol:
                          terrestrial:
                            version: 0
                        eid_rotation:
                          counter_source: DEVICE_UPTIME
                        key: "YWJjZGVmZw=="

                encryptedProtocolIN100:
                  summary: Matches AES-128-EAX (IN100 protocol) with DEVICE_UPTIME
                  value:
                    devices:
                      - device_id: "8ab53e36-b7fb-429f-8c2e-d536cab71091"
                        name: in100-sensor
                        created_ts: 1734567892
                        tags:
                          _env: production
                        protocol:
                          terrestrial:
                            version: 2
                        eid_rotation:
                          counter_source: DEVICE_UPTIME
                          period_exponent: 15
                        key: "YWJjZGVmZw=="
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

  /v1/org/{org_id}/devices:
    get:
      tags:
        - Devices
      operationId: list-devices
      x-criticality: high
      summary: List Devices
      description: |
        Returns all devices for your organization.

        **Required Scope:** `read-devices`

        ## Overview
        Use this endpoint to manage your device inventory and map Hubble-registered devices to your system. 
        (To consume a stream of incoming data, use the **Retrieve Organization Packets** endpoint.)

        ## Query Parameters
        
        ### Timestamp Filters
        Use timestamp filters to trim down the search results.
        * For simpliticy, we support the `between:{after_timestamp}:{before_timestamp}` operator.
        * The `after_timestamp` value is inclusive and the `before_timestamp` value is exclusive.

        ### Recent Packet
        Each device may return a `most_recent_packet` object. This is a sample packet that is periodically refreshed.
        * **Latency:** provided data is not updated in real-time or atomically with packet data.
        * **Availability:** registered devices that have never sent a packet will have an empty `most_recent_packet` field.

        :::warning
        **This endpoint should not be used to request packet data.** See "Retrieve Organization Packets". 
        :::

        When sorting by `most_recent_packet`,
        - Devices that have never sent a packet are included in results and sort to the beginning (ascending) or end (descending) of the page.
        - If `sort_ascending` is true, the pagination may return duplicate values since a device with a new `most_recent_packet` could be returned in subsequent pages.
        - If `sort_ascending` is false, the pagination may skip devices that receive new `most_recent_packet` data during the pagination.
        
        ## Example Queries
        - **Unused devices:** `filter_most_recent_packet_ts=between:0:1`
        - **Recently Active Devices:** `filter_most_recent_packet_ts=between:{timestamp_one_day_ago}:{timestamp_now}`
        - **Inactive Devices:** `filter_most_recent_packet_ts=between:1:{timestamp_one_week_ago}`
        - **Recently Registered Devices:** `filter_created_ts=between:{timestamp_one_day_ago}:{timestamp_now}`
        
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/filterTagsQueryParam'
        - $ref: '#/components/parameters/filterCreatedTSQueryParam'
        - $ref: '#/components/parameters/filterMostRecentPacketTSQueryParam'
        - $ref: '#/components/parameters/sortFieldQueryParam'
        - $ref: '#/components/parameters/sortAscendingQueryParam'
        - $ref: '#/components/parameters/continuationTokenHeader'
      responses:
        '200':
          description: Device Pages
          headers:
            Continuation-Token:
              $ref: '#/components/headers/ContinuationTokenHeader'
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/organizationDevice'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '500':
          $ref: '#/components/responses/ErrorInternalServer'

    patch:
      tags:
        - Devices
      operationId: batch-update-devices
      x-criticality: high
      summary: Batch Update Devices
      description: |
        Update multiple registered devices belonging to your organization in a single request.
        
        **Required Scope:** `write-devices`
        
        ## Overview
        - A maximum of 1000 devices can be updated in a single request.
        - Each update is idempotent. In the event of an internal error (i.e. `5xx`) some updates may be applied and others may not. Each update is idempotent and the whole request can be retried again to ensure a consistent update across the batch.
      parameters:
        - $ref: '#/components/parameters/orgIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - updates
              properties:
                updates:
                  type: array
                  description: Array of device update operations, up to 1000.
                  items:
                    type: object
                    required:
                      - device_id
                    properties:
                      device_id:
                        $ref: '#/components/schemas/deviceId'
                      set_name:
                        $ref: '#/components/schemas/deviceName'
                        description: Set the device name
                      set_tags:
                        $ref: '#/components/schemas/deviceTags'
                        description: Set the device tags
                      set_install_location:
                        $ref: '#/components/schemas/installLocation'
                      set_destination_org_id:
                        type: string
                        format: uuid
                        description: |
                          Reassign this device to another organization. The destination
                          must be this organization's paired sandbox/production partner
                          (created via the create-sandbox-org flow) - reassignment
                          between unpaired orgs is rejected.

                          Cannot be combined with `set_name`, `set_tags`,
                          `set_install_location`, or `set_deploy` on the same update
                          item. Other items in the same batch request may still be
                          ordinary field updates.

                          This moves the device's encryption keys and network-ID
                          lookups to the destination org and updates its `_env` tag to
                          match (`sandbox` or `production`). Packet history and device
                          history are **not** moved - they remain associated with the
                          device in the source organization. If the destination is
                          the sandbox org, its device-count cap is enforced across all
                          reassignments targeting it within the same batch request.
                        example: "123e4567-e89b-12d3-a456-426614174000"
            examples:
              updateNames:
                value:
                  updates:
                    - device_id: "6ea53e36-b7fb-429f-8c2e-d536cab71089"
                      set_name: "Device 1"
                    - device_id: "7fb64f47-c8gc-530g-9d3f-e647dbc8219a"
                      set_name: "Device 2"
              updateTags:
                value:
                  updates:
                    - device_id: "6ea53e36-b7fb-429f-8c2e-d536cab71089"
                      set_tags:
                        location: "warehouse-a"
                    - device_id: "7fb64f47-c8gc-530g-9d3f-e647dbc8219a"
                      set_tags:
                        location: "warehouse-b"
      responses:
